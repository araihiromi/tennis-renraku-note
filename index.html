<title>テニス部連絡ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: phone-width app column on pale green (white cards, soft shadow, green primary, orange for notices/bills, red for unpaid/absent); sticky top bar + bottom tab bar; admin switches to a PC sidebar dashboard on wide screens. */
:root{
  --bg:#F1F7F0; --surface:#FFFFFF; --surface-2:#F6FAF5; --soft:#E5F2E6; --ink:#1C2A21; --muted:#66766B; --rule:#E0EADF;
  --green:#2E8B4F; --green-ink:#FFFFFF; --green-soft:#E2F3E5;
  --orange:#D9711A; --orange-soft:#FFF2E1; --red:#D6463A; --red-soft:#FCE8E5; --amber:#A07208; --amber-soft:#FAF0D4; --blue:#2F6FB5;
  --shadow:0 1px 2px rgba(30,70,40,.06),0 6px 18px rgba(30,70,40,.06);
  --f:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --r:14px; --top-h:52px; --nav-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1611; --surface:#17211A; --surface-2:#1C2820; --soft:#1F3324; --ink:#E5EEE7; --muted:#9BAEA1; --rule:#2A3A2F;
  --green:#4CB377; --green-ink:#0E1510; --green-soft:#1B3525;
  --orange:#F0A256; --orange-soft:#38291A; --red:#F08273; --red-soft:#3A1F1B; --amber:#E5BE5B; --amber-soft:#342B13; --blue:#86B5EA;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1611; --surface:#17211A; --surface-2:#1C2820; --soft:#1F3324; --ink:#E5EEE7; --muted:#9BAEA1; --rule:#2A3A2F;
  --green:#4CB377; --green-ink:#0E1510; --green-soft:#1B3525;
  --orange:#F0A256; --orange-soft:#38291A; --red:#F08273; --red-soft:#3A1F1B; --amber:#E5BE5B; --amber-soft:#342B13; --blue:#86B5EA;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.col{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.wide .col{max-width:1120px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
header.top .col{height:var(--top-h);display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
header.top h1{margin:0;text-align:center;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-items:center;position:relative;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg.i{width:22px;height:22px}
.badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:17px;padding:0 4px;font-weight:700;text-align:center}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:560px;margin:0 auto;display:flex}
nav.bottom button{flex:1;min-width:0;background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:11px;position:relative}
nav.bottom button svg.i{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--green);font-weight:700}
nav.bottom .badge{top:3px;right:auto;left:calc(50% + 6px)}

main.col{padding-block:14px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

/* generic */
h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:700}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush{padding:0;overflow:hidden;gap:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;background:var(--green);color:var(--green-ink);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--green-soft);color:var(--green)}
.card-head .pill{background:var(--green-ink);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.orange{background:var(--orange-soft);color:var(--orange)}
.pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.grey{background:var(--soft);color:var(--muted)}
.pill.solid-red{background:var(--red);color:#fff}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.outline{border-color:var(--green);color:var(--green)}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--rule))}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:700;font-size:13px}
.link.muted{color:var(--muted);font-weight:500;text-decoration:underline}

.tabs{display:flex;border-bottom:1px solid var(--rule);overflow-x:auto;gap:4px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px 8px;font-weight:700;color:var(--muted);white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--green);border-bottom-color:var(--green)}

.facts{display:flex;flex-direction:column;gap:6px;font-size:14px}
.fact{display:flex;gap:8px;align-items:flex-start;min-width:0}
.fact svg.i{color:var(--muted);margin-top:2px}
.fact span{min-width:0;overflow-wrap:anywhere}
.bigdate{font-size:24px;font-weight:900;letter-spacing:.01em;line-height:1.2}
.bigdate small{font-size:16px;font-weight:700}

/* answer buttons */
.ans{display:flex;flex-direction:column;gap:8px}
.ans .who{font-size:13px;font-weight:700;color:var(--muted)}
.ans .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.a{border-radius:10px;padding:10px;font-weight:700;border:1.5px solid var(--rule);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:6px}
.a.yes{background:var(--green);border-color:var(--green);color:var(--green-ink);padding:12px;font-size:16px}
.a.yes.off{background:var(--surface);color:var(--green)}
.a.no{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--rule))}
.a.no.on{background:var(--red-soft);border-color:var(--red)}
.a.maybe{color:var(--muted)}
.a.maybe.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

/* notice / todo */
.notice{background:var(--orange-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid color-mix(in srgb,var(--orange) 25%,transparent)}
.notice .t{color:var(--orange);font-weight:700;display:flex;align-items:center;gap:6px}
.notice.red{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.notice.red .t{color:var(--red)}
.notice p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.todo{display:flex;flex-direction:column}
.todo button{display:flex;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--rule);padding:11px 2px;text-align:left;font-size:14px;width:100%}
.todo button:first-child{border-top:0}
.todo .dot{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--red);color:var(--red);display:grid;place-items:center;flex:none}
.todo .dot svg.i{width:13px;height:13px}
.sec-t{display:flex;align-items:center;gap:6px;font-weight:700}
.sec-t.orange{color:var(--orange)} .sec-t.red{color:var(--red)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .h{font-size:12px;color:var(--muted);padding:4px 0}
.cal .h.sat,.cal .d.sat{color:var(--blue)} .cal .h.sun,.cal .d.sun{color:var(--red)}
.cal .d{aspect-ratio:1;max-width:100%;border:0;background:none;border-radius:50%;display:grid;place-items:center;font-size:14px;position:relative;padding:0;margin:0 auto;width:min(40px,100%)}
.cal .d.out{color:var(--rule)}
.cal .d.has{background:var(--green-soft);color:var(--green);font-weight:700}
.cal .d.has.cx{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.cal .d.today{background:var(--green);color:var(--green-ink);font-weight:900}
.cal .d:not(.has):not(.today){cursor:default}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav strong{font-size:16px}

/* list cards */
.pcard{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 12px 14px 16px;text-align:left;width:100%}
.pcard .grow{display:flex;flex-direction:column;gap:3px}
.pcard .t{font-size:17px;font-weight:900}
.pcard .chev{color:var(--muted)}
.pcard.past{opacity:.75}

/* people list */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);min-width:0}
.prow:first-child{border-top:0}
.prow .grow{overflow-wrap:anywhere}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.av.c0{background:#4F9A6A}.av.c1{background:#D08A3A}.av.c2{background:#5D86B8}.av.c3{background:#B0637A}.av.c4{background:#7C8C3C}
.av.car{background:var(--green-soft);color:var(--green)}
.av.ride{background:var(--orange-soft);color:var(--orange)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].y{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.seg button[aria-pressed="true"].m{background:var(--soft);border-color:var(--muted);color:var(--ink)}
.seg button[aria-pressed="true"].n{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.seg button[aria-pressed="true"].a{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* money */
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
.line:first-child{border-top:0}
.line .sub{font-size:12px;color:var(--muted)}
.amt{font-weight:700;white-space:nowrap}
.bill{background:var(--orange-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.bill .l{color:var(--orange);font-weight:700;font-size:14px}
.bill .v{text-align:right;font-size:30px;font-weight:900;color:var(--orange);line-height:1.1}
.bill .v small{font-size:15px;margin-left:2px}
.bill.ok{background:var(--green-soft)} .bill.ok .l,.bill.ok .v{color:var(--green)}
.paystate{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paystate button{border-radius:10px;padding:10px;font-weight:700;border:1.5px solid var(--rule);background:var(--surface);color:var(--muted)}
.paystate button.on.unpaid{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.paystate button.on.paid{background:var(--green-soft);border-color:var(--green);color:var(--green)}

/* board */
.post{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--rule)}
.post:first-child{border-top:0;padding-top:2px}
.post .grow{display:flex;flex-direction:column;gap:4px}
.post .body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.post .meta{font-size:12px;color:var(--muted)}
.post .foot{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.like{background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.like.on{color:var(--orange);font-weight:700}
.comment{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}

/* record */
.photo-main{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--soft);display:block;max-width:100%}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img,.photos .add{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--soft);display:block;max-width:100%}
.photos .add{border:1.5px dashed var(--rule);display:grid;place-items:center;color:var(--muted);font-size:24px}
.ph{position:relative}
.ph button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1}
.numh{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.numh b{width:20px;height:20px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-size:12px}
ul.menu{margin:0;padding-left:22px;font-size:14px}
.tx{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:26px}

/* forms / sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,25,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:18px;padding:22px}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.wide{grid-column:1/-1}
.check{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.check input{margin-top:4px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* drawer */
.drawer{position:fixed;inset:0;z-index:40;background:rgba(10,25,15,.45)}
.drawer .in{position:absolute;top:0;bottom:0;left:0;width:min(300px,85%);background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.drawer .brand{display:flex;align-items:center;gap:8px;font-weight:900;padding:6px 10px 14px}
.ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#E9F56A,#C6D92A);position:relative;overflow:hidden;flex:none}
.ball::before,.ball::after{content:"";position:absolute;width:26px;height:26px;border:2px solid #fff;border-radius:50%;opacity:.9}
.ball::before{left:-17px;top:0}.ball::after{right:-17px;top:0}
.navitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:10px;text-align:left;font-weight:500;width:100%}
.navitem:hover,.navitem.on{background:var(--green-soft);color:var(--green);font-weight:700}
.bellpanel{position:fixed;z-index:40;top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 6px);right:max(10px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 20px));max-height:70vh;overflow-y:auto}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.num,th.num{text-align:right}
td.c,th.c{text-align:center}
.mk{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--green)}
.mk.off{background:none;border:1.5px solid var(--rule)} .mk.maybe{background:none;border:1.5px dashed var(--amber)}
tr.mine td{background:var(--green-soft)}
th.sticky,td.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
th.sticky{background:var(--surface-2)}
tr.mine td.sticky{background:var(--green-soft)}
.plus{color:var(--green)} .minus{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:26px 16px;border:2px dashed var(--rule);border-radius:var(--r);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{color:var(--ink)}
.warn{background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:14px}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.courtno{display:inline-flex;align-items:center;gap:4px;background:var(--green);color:var(--green-ink);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}

/* admin (PC) */
.admin{display:grid;gap:16px}
.side{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card.kpi{flex-direction:row;gap:12px;align-items:center;padding:14px}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi .ic svg.i{width:24px;height:24px}
.kpi .ic.g{background:var(--green-soft);color:var(--green)} .kpi .ic.o{background:var(--orange-soft);color:var(--orange)} .kpi .ic.r{background:var(--red-soft);color:var(--red)}
.kpi .v{font-size:22px;font-weight:900;line-height:1.2}
@media (min-width:900px){
  .admin{grid-template-columns:220px 1fr;align-items:start}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(var(--top-h) + 14px);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px}
  .admin .main{display:flex;flex-direction:column;gap:16px;min-width:0}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="col" id="top"></div></header>
<main class="col" id="app">
  <div class="empty"><strong>読み込み中…</strong><span>練習予定・出欠・送迎・費用・連絡を共有データから読み込んでいます。</span></div>
</main>
<nav class="bottom" aria-label="メニュー"><div class="in" id="nav"></div></nav>
<div id="overlay"></div>
<input type="file" id="photo-input" accept="image/*" hidden>
<div id="toast" hidden></div>

<script>
(function(){
const S={
  db:null,user:null,uid:null,admin:false,assets:null,ready:false,offline:false,
  members:[],practices:[],responses:[],rides:[],payments:[],costs:[],posts:[],comments:[],reads:[],likes:[],settings:{},

/* ---------- helpers ---------- */
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function iso(d){return ym(d)+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function nowLocal(){const d=new Date();return today()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function md(s){const d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()}
function wd(s){return WD[parseD(s).getDay()]}
function mdw(s){return md(s)+'('+wd(s)+')'}
function jdate(s){const d=parseD(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'}
function dl(s){return s?mdw(s.slice(0,10))+' '+s.slice(11,16):''}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)}
function stamp(t){const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function yen(n){return Math.round(Number(n||0)).toLocaleString('ja-JP')+'円'}
function monthLabel(m){const [y,mm]=m.split('-');return y+'年'+Number(mm)+'月'}
function mnum(m){return Number(m.split('-')[1])+'月'}
function shiftMonth(m,k){const [y,mm]=m.split('-').map(Number);return ym(new Date(y,mm-1+k,1))}
function mem(id){return S.members.find(x=>x._id===id)}
function name(id){return mem(id)?.name||'（削除された選手）'}
function famKey(id){return mem(id)?.family||id}
function famLabel(id){const k=famKey(id);const h=mem(k)||mem(id);if(!h)return '（不明）';const par=(mem(id)?.parent)||h.parent;return par?par+'さん':h.name+'の保護者'}
function famCount(){return new Set(S.members.map(m=>m.family||m._id)).size}
function avc(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return 'c'+(h%5)}
function av(id,label){const t=(label||name(id)).trim();return `<span class="av ${avc(id)}" aria-hidden="true">${esc(t.slice(0,1))}</span>`}
function resp(pid,mid){return S.responses.find(r=>r.practiceId===pid&&r.memberId===mid)}
function isMine(id){return S.family.includes(id)}
function mineFam(id){return id&&S.family.length&&famKey(id)===famKey(S.family[0])}
function rep(){return S.family[0]||null}
function draft(k,def){return S.drafts[k]??def}
function memberIds(){return S.members.map(m=>m._id)}
function attendees(pid){return S.responses.filter(r=>r.practiceId===pid&&r.attend==='yes'&&mem(r.memberId)).map(r=>r.memberId)}
function inMonth(s,m){return s&&s.startsWith(m||S.month)}
function byDate(a,b){return (a.date+(a.start||'')).localeCompare(b.date+(b.start||''))}
function monthPractices(m){return S.practices.filter(p=>inMonth(p.date,m)).sort(byDate)}

/* ---------- money ---------- */
function shareItems(m){
  // each billable item for the month with its per-person share and who owes it
  const items=[];
  for(const p of monthPractices(m)){
    if(p.status==='cancelled'||!p.fee)continue;
    const ids=attendees(p._id);
    items.push({key:'p:'+p._id,kind:'テニスコート代金',label:`テニスコート代金（${md(p.date)}）`,date:p.date,amount:Number(p.fee),ids,share:ids.length?roundUp(p.fee/ids.length):0,practiceId:p._id,costId:'',sub:ids.length?`${ids.length}名で按分（1人 ${yen(roundUp(p.fee/ids.length))}）`:'参加者がいないため未割当'});
  }
  for(const c of S.costs.filter(c=>inMonth(c.date,m))){
    const ids=c.split==='practice'&&c.practiceId?attendees(c.practiceId):memberIds();
    const pr=practice(c.practiceId);
    items.push({key:'c:'+c._id,kind:c.kind,label:c.kind+(pr?`（${md(pr.date)}）`:''),date:c.date,amount:Number(c.amount||0),ids,share:ids.length?roundUp(c.amount/ids.length):0,practiceId:c.split==='practice'?c.practiceId:'',costId:c._id,sub:(c.note?c.note+' ・ ':'')+(ids.length?`${ids.length}名で按分（1人 ${yen(roundUp(c.amount/ids.length))}）`:'未割当'),cost:c});
  }
  return items.sort((a,b)=>a.date.localeCompare(b.date));
}
// 立替: someone pays the court (or shop) in full; to '' and not a settlement
function upfront(it){return S.payments.filter(x=>!x.to&&!x.settle&&(it.costId?x.costId===it.costId:(x.practiceId===it.practiceId&&!x.costId)))}
function courtPaid(pid){return S.payments.filter(x=>x.practiceId===pid&&!x.to&&!x.settle&&!x.costId)}
function payMonth(x){return x.month||(x.date||'').slice(0,7)}
function ledger(m){
  const L={};S.members.forEach(x=>L[x._id]={owe:0,paid:0,recv:0});
  const items=shareItems(m);
  for(const it of items){
    for(const id of it.ids)if(L[id])L[id].owe+=it.share;
    // rounding surplus goes to whoever paid upfront, so the month nets to zero
    const first=upfront(it)[0];const extra=it.share*it.ids.length-it.amount;
    if(first&&extra>0&&L[first.memberId])L[first.memberId].paid+=extra;
  }
  for(const x of S.payments.filter(x=>payMonth(x)===m)){
    const a=Number(x.amount||0);
    if(L[x.memberId])L[x.memberId].paid+=a;
    if(x.to&&L[x.to])L[x.to].recv+=a;
  }
  for(const k in L)L[k].bal=L[k].paid-L[k].recv-L[k].owe;
  return {L,items};
}
function famBalances(m){
  const {L}=ledger(m);const F={};
  for(const x of S.members){const k=famKey(x._id);F[k]=F[k]||{owe:0,paid:0,recv:0,bal:0};for(const f of ['owe','paid','recv','bal'])F[k][f]+=L[x._id][f]}
  return F;
}
function transfers(m){
  // who pays whom at month end: largest debts to largest credits
  const F=famBalances(m);
  const cr=Object.keys(F).filter(k=>F[k].bal>0.5).map(k=>({k,need:F[k].bal})).sort((a,b)=>b.need-a.need);
  const dr=Object.keys(F).filter(k=>F[k].bal<-0.5).map(k=>({k,owe:-F[k].bal})).sort((a,b)=>b.owe-a.owe);
  const out=[];
  for(const d of dr){let left=d.owe;for(const c of cr){if(left<0.5)break;if(c.need<0.5)continue;const a=Math.min(left,c.need);out.push({from:d.k,to:c.k,amount:Math.round(a)});c.need-=a;left-=a}}
  return out.filter(o=>o.amount>0);
}
function unpaidFamilies(m){const F=famBalances(m);return new Set(Object.keys(F).filter(k=>F[k].bal<-0.5))}
function myBal(m){if(!S.family.length)return null;return famBalances(m)[famKey(S.family[0])]||null}

// One shared password set by an admin. Admins (Editor and up) skip the lock screen.
async function sha(text){
  const bytes=new TextEncoder().encode(text);
  if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  return sha256js(bytes);
}
// fallback for views without crypto.subtle
function sha256js(bytes){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
  const w=new Uint32Array(64),r=(x,c)=>(x>>>c)|(x<<(32-c));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}

    h+=`<div class="drawer" data-act="closeOverlay"><nav class="in" aria-label="メニュー" data-stop="1"><div class="brand"><span class="ball"></span>テニス部連絡ノート</div>${items.map(([k,i,l])=>`<button class="navitem${S.tab===k?' on':''}" data-act="${k==='goRide'?'goRide':'tab'}" data-k="${k==='goRide'?'':k}">${ic(i)}${l}</button>`).join('')}
      ${S.settings.pwHash&&!S.admin?`<button class="navitem" data-act="logout">${ic('back')}ログアウト</button>`:''}
      <p class="note" style="padding:14px 12px 0">${S.family.length?esc(S.family.map(name).join('・'))+' の保護者として利用中':'マイページでお子さんを選んでください'}</p></nav></div>`;
  }

}
function tabs(group,items,val){return `<div class="tabs" role="tablist">${items.map(([k,l])=>`<button role="tab" data-act="sub" data-g="${group}" data-k="${k}" aria-selected="${val===k}">${l}</button>`).join('')}</div>`}
function monthNav(){
  return `<div class="monthnav"><button class="iconbtn" data-act="month" data-k="-1" aria-label="前の月">${ic('back')}</button><strong>${monthLabel(S.month)}</strong><button class="iconbtn" data-act="month" data-k="1" aria-label="次の月">${ic('chev')}</button></div>`;
}
function needFamily(){
  if(S.family.length)return '';
  return `<div class="warn">はじめに「マイページ」でお子さん（選手）を選んでください。兄弟姉妹がいる場合は複数選べます。 <button class="link" data-act="tab" data-k="me">マイページへ</button></div>`;
}
function facts(p,full){
  const f=[[ 'clock',(p.start||'')+(p.end?' 〜 '+p.end:'')],['pin',`${p.place}　<span class="courtno">${esc(p.court)}番コート</span>`,true]];
  if(p.meetTime||p.meetPlace)f.push(['person','集合 '+[p.meetTime,p.meetPlace].filter(Boolean).join(' ')]);
  if(full){if(p.fee)f.push(['money',`テニスコート代金 ${yen(p.fee)}（参加者で割り勘）`]);if(p.deadline)f.push(['bell','回答締切 '+dl(p.deadline)]);if(p.note)f.push(['talk',p.note])}
  return `<div class="facts">${f.map(([i,t,raw])=>`<div class="fact">${ic(i)}<span>${raw?t.replace(p.place,esc(p.place)):esc(t)}</span></div>`).join('')}</div>`;

function viewHome(){

/* ----- ② 練習予定 ----- */
function calendar(){
  const [y,m]=S.month.split('-').map(Number);
  const first=new Date(y,m-1,1),start=new Date(y,m-1,1-first.getDay());
  const days=new Map();S.practices.forEach(p=>{if(!days.has(p.date)||p.status!=='cancelled')days.set(p.date,p)});
  let h=`<div class="cal">${WD.map((w,i)=>`<div class="h${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('')}`;
  const t=today();
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(i>=35&&d.getMonth()!==m-1)break;
    const s=iso(d),p=days.get(s),out=d.getMonth()!==m-1;
    const cls=['d',d.getDay()===0?'sun':d.getDay()===6?'sat':'',out?'out':'',p&&!out?'has':'',p&&p.status==='cancelled'?'cx':'',s===t?'today':''].join(' ');
    h+=p&&!out?`<button class="${cls}" data-act="openDetail" data-p="${p._id}" aria-label="${jdate(s)}の練習">${d.getDate()}</button>`:`<span class="${cls}">${d.getDate()}</span>`;
  }
  return h+'</div>';
}
function viewPlan(){
  let h=needFamily()+`<section class="card">${monthNav()}${calendar()}<div class="row between"><span class="note">緑の日に練習があります。日付を押すと詳細が開きます。</span><button class="link" data-act="planMode">${S.planMode==='stats'?'予定一覧に戻る':'月間参加記録 ›'}</button></div></section>`;
  if(S.planMode==='stats')return h+`<h2>${monthLabel(S.month)}の参加記録</h2>`+statsTable(false);
  const list=monthPractices();
  if(!list.length)h+=`<div class="empty"><strong>${monthLabel(S.month)}の練習予定はまだありません</strong><span>「予定を作成」から登録できます。誰でも作成できます。</span></div>`;
  for(const p of list){
    h+=`<button class="pcard${p.date<today()?' past':''}" data-act="openDetail" data-p="${p._id}"><div class="grow">
      <div class="row between"><span class="t">${jdate(p.date)}（${wd(p.date)}）</span>${statusPill(p)}</div>${facts(p)}${rideSummary(p)}</div><span class="chev">${ic('chev')}</span></button>`;
  }
  return h+`<button class="btn primary block" data-act="newPractice">${ic('plus')}予定を作成</button>`;
}

/* ----- ③ 予定の詳細・出欠 ----- */
function viewDetail(p){
  const cx=p.status==='cancelled';
  let h=`<section class="card"><div class="row between"><div class="bigdate">${jdate(p.date)}<small>（${wd(p.date)}）</small></div>${statusPill(p)}</div>
    <div class="muted">${esc(p.start||'')}${p.end?' 〜 '+esc(p.end):''}</div>
    ${tabs('dtab',[['summary','概要'],['attend','出欠'],['ride','送迎'],['bring','持ち物'],['talk','連絡']],S.dtab)}`;
  if(S.dtab==='attend')h+=detailAttend(p);
  else if(S.dtab==='ride')h+=p.status==='cancelled'?'<p class="note">この練習は中止のため、送迎の調整はありません。</p>':rideBody(p);
  else if(S.dtab==='bring')h+=detailBring(p);
  else if(S.dtab==='talk')h+=detailTalk(p);
  else h+=detailSummary(p);
  return h+'</section>';
}
function detailSummary(p){
  const cx=p.status==='cancelled',canManage=S.admin||mineFam(p.createdBy);
  const yes=attendees(p._id);
  let h=facts(p,true);
  if(cx)h+=`<div class="notice red"><div class="t">${ic('alert')}中止</div><p>${esc(p.cancelReason||'理由の記載なし')}</p></div>`;
  if(p.fee&&yes.length)h+=`<p class="note">いまの参加者 ${yes.length}名で割ると、1人 ${yen(roundUp(p.fee/yes.length))}（${S.settings.round||10}円単位で切り上げ）。月末にまとめて精算します。</p>`;
  if(p.fee&&!cx){const cp=courtPaid(p._id);h+=cp.length?`<p class="note">テニスコート代金を払った人：${cp.map(x=>`<strong>${esc(famLabel(x.memberId))}</strong>（${yen(x.amount)}）${S.admin||mineFam(x.memberId)?` <button class="link muted" data-act="delPay" data-r="${x._id}">取り消す</button>`:''}`).join('、')}</p>`:'<p class="note" style="color:var(--red)">テニスコート代金を払った人はまだ記録されていません。</p>'}
  if(!cx){
    const drv=S.responses.filter(r=>r.practiceId===p._id&&r.attend==='yes'&&r.transport==='can');
    const need=S.responses.filter(r=>r.practiceId===p._id&&r.attend==='yes'&&r.transport==='cannot');
    h+=`<button class="pcard" data-act="goRide" data-p="${p._id}" style="box-shadow:none"><span class="av car">${ic('car')}</span><div class="grow"><strong>送迎調整</strong><span class="note">車を出せる ${drv.length}台 ・ 乗せてほしい ${need.length}人</span></div><span class="chev">${ic('chev')}</span></button>`;
  }
  if(S.open['cancel:'+p._id])h+=`<form class="card" data-form="cancel" data-p="${p._id}" style="box-shadow:none"><div class="field"><label for="cr-${p._id}">中止の理由（全員に表示）</label><input id="cr-${p._id}" data-draft="cr.${p._id}" value="${esc(draft('cr.'+p._id,'雨天のため中止します'))}"></div><label class="check"><input type="checkbox" id="cn-${p._id}" data-draft-check="cn.${p._id}" ${draft('cn.'+p._id,true)?'checked':''}> 連絡掲示板に緊急連絡として投稿する</label><div class="actions"><button type="button" class="btn sm" data-act="close" data-k="cancel:${p._id}">やめる</button><button class="btn sm danger">中止にする</button></div></form>`;
  const hist=p.history||[];
  if(hist.length)h+=`<details><summary>変更履歴（${hist.length}件）</summary><ul>${hist.slice().reverse().map(x=>`<li>${stamp(x.at)} ${esc(x.text)}</li>`).join('')}</ul></details>`;
  h+=`<div class="row">
    ${S.family.length&&!cx&&p.fee&&!courtPaid(p._id).length?`<button class="btn sm primary" data-act="sheet" data-k="pay" data-p="${p._id}">テニスコート代金を払った</button>`:''}
    ${p.date<=today()&&!cx?`<button class="btn sm" data-act="sheet" data-k="record" data-p="${p._id}">${p.record?'練習記録を編集':'練習記録を書く'}</button>`:''}
    <button class="btn sm" data-act="sheet" data-k="practice" data-p="${p._id}">編集</button>
    <button class="btn sm" data-act="sheet" data-k="dup" data-p="${p._id}">複製</button>
    ${canManage?(cx?`<button class="btn sm" data-act="uncancel" data-p="${p._id}">中止を取り消す</button>`:`<button class="btn sm danger" data-act="toggle" data-k="cancel:${p._id}">中止にする</button>`):''}
    ${canManage?(S.confirm==='p:'+p._id?`<button class="btn sm danger" data-act="delPractice" data-p="${p._id}">本当に削除する</button>`:`<button class="link muted" data-act="confirm" data-k="p:${p._id}">削除</button>`):''}
  </div>`;
  return h;
}
function detailAttend(p){
  const cx=p.status==='cancelled';
  let h='';
  if(!cx)h+=`<div><h3>参加の登録</h3>${p.deadline?`<p class="note">締切 ${dl(p.deadline)}${deadlinePassed(p)?'（締切を過ぎています）':''}</p>`:''}</div>${answerBlock(p)}`;
  const rows=S.members.map(m=>({m,r:resp(p._id,m._id),on:resp(p._id,m._id)?.attend==='yes'}));
  const n=rows.filter(r=>r.on).length;

    <div class="seg"><button class="y" data-act="attFilter" data-k="yes" aria-pressed="${f==='yes'}">参加 ${n}</button><button class="m" data-act="attFilter" data-k="off" aria-pressed="${f==='off'}">登録なし ${rows.length-n}</button><button class="a" data-act="attFilter" data-k="all" aria-pressed="${f==='all'}">全員</button></div>`;
  const shown=rows.filter(x=>f==='all'||(f==='yes'?x.on:!x.on));
  h+=shown.length?`<div class="plist">${shown.map(({m,r,on})=>`<div class="prow">${av(m._id)}<div class="grow"><strong>${esc(m.name)}</strong> <span class="small muted">${m.parent?'（'+esc(m.parent)+'さん）':''}</span>${on&&r.transport?`<div class="small muted">${r.transport==='can'?'車を出せる（'+(r.seats||0)+'人乗れる）':r.transport==='cannot'?'送迎希望':'自分で行く'}</div>`:''}</div>
      ${on?(r.walkIn?'<span class="pill orange">管理者が追加</span>':'<span class="pill">参加</span>'):'<span class="pill grey">—</span>'}
      ${S.admin&&!cx?(on?`<button class="link muted" data-act="adminAttend" data-p="${p._id}" data-m="${m._id}" data-k="">外す</button>`:`<button class="btn sm outline" data-act="adminAttend" data-p="${p._id}" data-m="${m._id}" data-k="yes">参加にする</button>`):''}</div>`).join('')}</div>`:'<p class="note">該当する人はいません。</p>';
  if(S.admin)h+='<p class="note">保護者の登録なしで来た子は、管理者が「参加にする」で追加できます。追加した子もテニスコート代金の割り勘と参加日数に入ります。</p>';
  return h;

function detailBring(p){
  const items=(p.bring||'').split(/[、,，\n]/).map(s=>s.trim()).filter(Boolean);

function detailTalk(p){
  const posts=S.posts.filter(x=>x.practiceId===p._id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return `${S.family.length?`<button class="btn outline sm" data-act="sheet" data-k="post" data-p="${p._id}" style="align-self:flex-start">${ic('plus')}この練習について連絡</button>`:''}`+(posts.length?`<div>${posts.map(postItem).join('')}</div>`:'<p class="note">この練習についての連絡はまだありません。</p>');

/* ----- ④ 送迎調整 ----- */
function rideCtx(p){
  const rs=S.responses.filter(r=>r.practiceId===p._id&&r.attend==='yes'&&mem(r.memberId));
  const drivers=rs.filter(r=>r.transport==='can'),riders=rs.filter(r=>r.transport==='cannot');
  const rides=S.rides.filter(r=>r.practiceId===p._id);
  const accepted=rides.filter(r=>r.status==='accepted');
  const used=d=>accepted.filter(r=>famKey(r.byId)===famKey(d.memberId)).length;
  const assigned=mid=>accepted.find(r=>r.fromId===mid);
  return {drivers,riders,rides,accepted,used,assigned};
}
function rideSummary(p){
  if(p.status==='cancelled'||p.date<today())return '';
  const C=rideCtx(p);if(!C.drivers.length&&!C.riders.length)return `<div class="fact small muted">${ic('car')}<span>送迎の登録はまだありません</span></div>`;
  const seats=C.drivers.reduce((t,d)=>t+Math.max(0,(d.seats||0)-C.used(d)),0),wait=C.riders.filter(r=>!C.assigned(r.memberId)).length;
  return `<div class="fact small">${ic('car')}<span>車 ${C.drivers.length}台・空き ${seats}人・乗りたい ${C.riders.length}人${wait?` <span class="pill orange">未決定 ${wait}</span>`:' <span class="pill">送迎決定</span>'}</span></div>`;
}
function rideBody(p){
  // 送迎調整（練習の詳細の「送迎」タブに表示）
  const C=rideCtx(p);
  let h=`<div class="seg" role="group" aria-label="送迎">${[['drivers','乗せられる'],['riders','乗りたい'],['result','調整結果']].map(([k,l])=>`<button class="y" data-act="sub" data-g="ride" data-k="${k}" aria-pressed="${S.sub.ride===k}">${l}</button>`).join('')}</div>`;
  const S2=S.sub.ride;
  if(S2==='drivers'){
    h+=`<div class="row between"><span class="sec-t">車を出せる方 <span class="muted" title="参加と回答したうえで車を出せる家庭">${ic('q')}</span></span>${S.family.length?`<button class="btn sm primary" data-act="sheet" data-k="driver" data-p="${p._id}">${ic('plus')}登録する</button>`:''}</div>`;
    h+=C.drivers.length?`<div class="plist">${C.drivers.map(d=>{const left=Math.max(0,(d.seats||0)-C.used(d));return `<div class="prow"><span class="av car">${ic('car')}</span><div class="grow"><div class="row" style="gap:10px"><strong>${esc(famLabel(d.memberId))}</strong><span class="small">${d.seats||0}人</span>${left?`<span class="pill">空き${left}</span>`:'<span class="pill grey">満席</span>'}</div><div class="small muted">${esc(d.route||'経路・出発時刻は未記入')}</div></div>${isMine(d.memberId)?`<button class="btn sm" data-act="sheet" data-k="driver" data-p="${p._id}" data-m="${d.memberId}">編集</button>`:''}</div>`}).join('')}</div>`:'<p class="note">まだ登録がありません。車を出せる方は「登録する」から、乗せられる人数と出発場所を入力してください。</p>';
  }else if(S2==='riders'){
    const myDriver=C.drivers.find(d=>isMine(d.memberId));
    const myLeft=myDriver?Math.max(0,(myDriver.seats||0)-C.used(myDriver)):0;
    h+=`<div class="row between"><span class="sec-t">乗せてほしい方 <span class="muted" title="参加と回答したうえで送迎を希望する人">${ic('q')}</span></span>${S.family.length?`<button class="btn sm primary" data-act="sheet" data-k="rider" data-p="${p._id}">${ic('plus')}登録する</button>`:''}</div>`;
    h+=C.riders.length?`<div class="plist">${C.riders.map(r=>{const a=C.assigned(r.memberId);const req=C.rides.find(x=>x.fromId===r.memberId&&x.status==='open');let right='';
      if(a)right=`<span class="pill">決定</span>`;
      else if(myLeft&&!isMine(r.memberId))right=`<button class="btn sm primary" data-act="take" data-p="${p._id}" data-m="${r.memberId}">乗せる</button>`;
      else if(isMine(r.memberId)&&!req)right=`<button class="btn sm" data-act="sheet" data-k="ask" data-p="${p._id}" data-m="${r.memberId}">お願いする</button>`;
      else right=`<span class="pill orange">調整中</span>`;
      return `<div class="prow"><span class="av ride">${ic('person')}</span><div class="grow"><div class="row" style="gap:10px"><strong>${esc(name(r.memberId))}さん</strong><span class="small">1人</span></div><div class="small muted">${esc(r.pickup||'乗る場所は未記入')}${a?' ・ '+esc(famLabel(a.byId))+'の車':req?' ・ '+(req.toId?esc(famLabel(req.toId))+'へ依頼中':'依頼中'):''}</div></div>${right}</div>`}).join('')}</div>`:'<p class="note">乗せてほしい方の登録はまだありません。</p>';
    if(myDriver)h+=`<p class="note">あなたの車の空き：${myLeft}人。「乗せる」を押すと送迎が決まります。</p>`;
  }else{
    const groups=C.drivers.map(d=>({d,list:C.accepted.filter(r=>famKey(r.byId)===famKey(d.memberId))})).filter(g=>g.list.length);
    const orphan=C.accepted.filter(r=>!C.drivers.some(d=>famKey(d.memberId)===famKey(r.byId)));
    const waiting=C.riders.filter(r=>!C.assigned(r.memberId));
    h+=groups.length||orphan.length?groups.map(g=>`<div class="card" style="box-shadow:none;gap:6px"><div class="row" style="gap:10px"><span class="av car">${ic('car')}</span><div class="grow"><strong>${esc(famLabel(g.d.memberId))}の車</strong><div class="small muted">${esc(g.d.route||'')}</div></div><span class="small">${g.list.length}/${g.d.seats||0}人</span></div>${g.list.map(r=>rideLine(r)).join('')}</div>`).join('')+orphan.map(r=>`<div class="card" style="box-shadow:none;gap:6px"><strong>${esc(famLabel(r.byId))}の車</strong>${rideLine(r)}</div>`).join(''):'<p class="note">決まった送迎はまだありません。</p>';
    const pend=C.rides.filter(r=>r.status!=='accepted');
    if(pend.length)h+=`<h3>依頼中</h3>`+pend.map(r=>{let b='';if(r.status==='open'&&r.toId&&isMine(r.toId))b=`<button class="btn sm primary" data-act="rideAccept" data-r="${r._id}">引き受ける</button><button class="btn sm" data-act="rideDecline" data-r="${r._id}">今回は無理</button>`;else if(r.status==='open'&&!r.toId&&S.family.length&&!isMine(r.fromId))b=`<button class="btn sm primary" data-act="rideAccept" data-r="${r._id}">引き受ける</button>`;if(isMine(r.fromId)||S.admin)b+=`<button class="link muted" data-act="rideDel" data-r="${r._id}">取り消す</button>`;
      return `<div class="prow"><span class="av ride">${ic('person')}</span><div class="grow"><strong>${esc(name(r.fromId))}さん</strong> → ${r.toId?esc(famLabel(r.toId)):'車を出せる方どなたか'}<div class="small muted">${r.status==='declined'?'今回はむずかしいそうです':'返事待ち'}${r.message?' ・ '+esc(r.message):''}</div></div><div class="row">${b}</div></div>`}).join('');
    if(waiting.length)h+=`<p class="note">まだ決まっていない人：${waiting.map(r=>esc(name(r.memberId))+'さん').join('、')}</p>`;
    h+='<p class="note">住所や電話番号は書かずに、待ち合わせ場所と時刻だけを共有してください。</p>';
  }
  return h;
}
function rideLine(r){
  return `<div class="row small" style="padding-left:44px;gap:8px">${ic('person')}<span class="grow">${esc(name(r.fromId))}さん ・ ${esc(r.meetPoint||resp(r.practiceId,r.fromId)?.pickup||'待ち合わせ未定')}</span>${mineFam(r.byId)||isMine(r.fromId)||S.admin?`<button class="link muted" data-act="rideUndo" data-r="${r._id}">取り消す</button>`:''}</div>`;
}

/* ----- ⑤ 費用管理 ----- */
function viewMoney(){
  let h=needFamily()+`<section class="card">${tabs('money',[['month','今月の精算'],['history','履歴'],['summary','集計']],S.sub.money)}${monthNav()}`;
  if(S.sub.money==='month')h+=moneyMonth();
  else if(S.sub.money==='history')h+=moneyHistory();
  else h+=moneySummary();
  return h+'</section>';
}
function moneyMonth(){
  const items=shareItems(S.month);
  const tr=transfers(S.month);
  let h=`<div class="row between"><h2>${mnum(S.month)}の精算</h2>${tr.length?'<span class="pill orange">未精算あり</span>':items.length?'<span class="pill">精算済み</span>':''}</div>
    <p class="note">テニスコート代金はその日に誰かが立て替えて払い、ほかの家庭は月に1回まとめて立て替えた人に払います。</p>`;
  h+=items.length?`<div class="lines">${items.map(it=>{const up=upfront(it);return `<div class="line"><div><div>・${esc(it.label)}</div><div class="sub">${esc(it.sub)}</div><div class="sub">${up.length?'立替：'+up.map(x=>esc(famLabel(x.memberId))).join('、'):'<span style="color:var(--red)">まだ誰も払っていません</span>'}</div></div><div style="text-align:right"><span class="amt">${yen(it.amount)}</span>${!up.length&&S.family.length?`<br><button class="link" data-act="sheet" data-k="pay" data-p="${it.costId?'':it.practiceId}" data-m="${it.costId||''}">払った</button>`:''}</div></div>`}).join('')}</div>`:'<p class="note">今月の費用はまだありません。テニスコート代金のある練習や、ボール代などを登録するとここに出ます。</p>';
  const b=myBal(S.month);
  if(b&&(b.owe||b.paid)){
    const bal=Math.round(b.bal);
    h+=`<div class="bill${bal<0?'':' ok'}"><span class="l">${bal<0?'月末に支払う金額':bal>0?'月末に受け取る金額':'ご家庭の精算'}</span><span class="v">${Math.abs(bal).toLocaleString('ja-JP')}<small>円</small></span>
      <span class="note" style="text-align:right">負担額 ${yen(b.owe)} ・ 立て替え・支払い済み ${yen(b.paid)}${b.recv?' ・ 受け取り済み '+yen(b.recv):''}</span></div>`;
    const days=items.filter(it=>!it.costId&&S.family.some(id=>it.ids.includes(id)));
    if(days.length)h+=`<h3>${mnum(S.month)}の参加履歴（${days.length}回）</h3><div class="lines">${days.map(it=>{const kids=S.family.filter(id=>it.ids.includes(id));const mineUp=upfront(it).some(x=>mineFam(x.memberId));return `<div class="line" style="align-items:center"><div>${mdw(it.date)} <span class="small muted">${S.family.length>1?kids.map(name).join('・'):''}</span></div><div class="row" style="gap:10px"><span class="amt">${yen(it.share*kids.length)}</span>${mineUp?'<span class="pill">立替</span>':''}</div></div>`}).join('')}</div>`;
  }
  // 払う側（未払い）は管理者と本人の家庭だけに表示する
  const mine=tr.map((o,i)=>({...o,i})).filter(o=>S.admin||mineFam(o.from));
  h+=`<h3>${S.admin?'支払う金額（全家庭）':'あなたの家庭が支払う金額'}</h3>`;
  h+=mine.length?`<div class="lines">${mine.map(o=>`<div class="line" style="align-items:center"><div>${S.admin?`<strong>${esc(famLabel(o.from))}</strong> → `:''}<strong>${esc(famLabel(o.to))}</strong>${S.admin?'':' へ'}</div><div class="row" style="gap:10px"><span class="amt">${yen(o.amount)}</span>${S.confirm==='settle:'+o.i?`<button class="btn sm primary" data-act="settle" data-k="${o.i}">払ったので記録</button>`:`<button class="pill red" style="border:0" data-act="confirm" data-k="settle:${o.i}">未払い</button>`}</div></div>`).join('')}</div><p class="note">お金を渡したら「未払い」を押して記録してください。${S.admin?'この一覧は管理者画面と、支払う本人の家庭にだけ表示されます。':'この金額は、あなたの家庭と管理者にだけ表示されます。'}</p>`:'<p class="note">支払いが必要な金額はありません。</p>';
  if(!S.admin){const inc=tr.filter(o=>mineFam(o.to)).reduce((s,o)=>s+o.amount,0);if(inc)h+=`<p class="note">あなたの家庭が受け取る予定：<strong>${yen(inc)}</strong>（支払う側の名前は管理者だけが確認できます）</p>`}
  h+=paidTable(S.month);
  return h;
}
function paidTable(m){
  // 払った金額はみんなに公開
  const by={};
  for(const x of S.payments.filter(x=>payMonth(x)===m&&mem(x.memberId))){
    const k=famKey(x.memberId);by[k]=by[k]||{up:0,settle:0};
    if(x.to)by[k].settle+=Number(x.amount||0);else by[k].up+=Number(x.amount||0);
  }
  const keys=Object.keys(by);
  return `<h3>${mnum(m)}に払った金額（全員に公開）</h3>`+(keys.length?`<div class="scroll"><table><thead><tr><th class="sticky">家庭</th><th class="num">テニスコート代金などの立替</th><th class="num">精算で払った</th><th class="num">合計</th></tr></thead><tbody>${keys.map(k=>`<tr${mineFam(k)?' class="mine"':''}><td class="sticky">${esc(famLabel(k))}<div class="small muted">${S.members.filter(x=>famKey(x._id)===k).map(x=>esc(x.name)).join('・')}</div></td><td class="num">${by[k].up?yen(by[k].up):'—'}</td><td class="num">${by[k].settle?yen(by[k].settle):'—'}</td><td class="num"><strong>${yen(by[k].up+by[k].settle)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">今月はまだ誰も払っていません。</p>');
}
function moneyHistory(){
  const list=S.payments.filter(x=>payMonth(x)===S.month).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  let h=S.family.length?`<div class="row"><button class="btn sm primary" data-act="sheet" data-k="pay">${ic('plus')}支払いを記録</button><button class="btn sm" data-act="sheet" data-k="cost">${ic('plus')}ボール代・備品代を追加</button></div>`:'';
  if(!list.length)return h+`<p class="note">${monthLabel(S.month)}の支払い記録はまだありません。</p>`;
  return h+`<div class="lines">${list.map(x=>{const pr=practice(x.practiceId),c=S.costs.find(y=>y._id===x.costId);const can=S.admin||isMine(x.memberId);return `<div class="line"><div><div><strong>${mdw(x.date)}</strong> ${esc(famLabel(x.memberId))}</div><div class="sub">${x.to?esc(famLabel(x.to))+'へ精算':'会計・コートへ'}${c?' ・ '+esc(c.kind):pr?' ・ '+md(pr.date)+'のテニスコート代金':''}${x.note?' ・ '+esc(x.note):''}</div></div><div class="row" style="gap:8px"><span class="amt">${yen(x.amount)}</span>${can?(S.confirm==='pay:'+x._id?`<button class="btn sm danger" data-act="delPay" data-r="${x._id}">削除</button>`:`<button class="link muted" data-act="confirm" data-k="pay:${x._id}">削除</button>`):''}</div></div>`}).join('')}</div>`;
}
function moneySummary(){
  if(!S.members.length)return '<p class="note">選手が登録されていません。</p>';
  const F=famBalances(S.month);
  let h=paidTable(S.month);
  // 払う側の一覧は管理者だけ。保護者には自分の家庭の分だけ
  const keys=Object.keys(F).filter(k=>S.admin||mineFam(k)).filter(k=>F[k].owe||F[k].paid||F[k].recv);
  h+=`<h3>${S.admin?mnum(S.month)+'の負担と差額（全家庭・管理者のみ）':mnum(S.month)+'のあなたの家庭'}</h3>`;
  h+=keys.length?`<div class="scroll"><table><thead><tr><th class="sticky">家庭</th><th class="num">負担額</th><th class="num">払った</th><th class="num">受け取った</th><th class="num">月末の精算</th></tr></thead><tbody>${keys.map(k=>{const x=F[k],b=Math.round(x.bal);return `<tr${mineFam(k)?' class="mine"':''}><td class="sticky">${esc(famLabel(k))}<div class="small muted">${S.members.filter(m=>famKey(m._id)===k).map(m=>esc(m.name)).join('・')}</div></td><td class="num">${yen(x.owe)}</td><td class="num">${yen(x.paid)}</td><td class="num">${yen(x.recv)}</td><td class="num ${b<0?'minus':b>0?'plus':''}">${b<0?'支払う '+yen(-b):b>0?'受け取る '+yen(b):'済み'}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="note">今月の負担はありません。</p>';
  h+=`<p class="note">負担額は参加した練習のテニスコート代金などを参加者で割った額（${S.settings.round||10}円単位で切り上げ）です。欠席した日の負担はありません。${S.admin?'この表は管理者だけに表示されます。':'ほかの家庭の負担額は管理者だけが確認できます。'}</p>`;
  const costs=S.costs.filter(c=>inMonth(c.date)).sort((a,b)=>a.date.localeCompare(b.date));
  if(costs.length)h+=`<h3>ボール代・備品代など</h3><div class="lines">${costs.map(c=>`<div class="line"><div><div>${mdw(c.date)} ${esc(c.kind)}</div><div class="sub">${c.split==='practice'?'練習の参加者で割る':'全員で割る'}${c.note?' ・ '+esc(c.note):''}</div></div><div class="row" style="gap:8px"><span class="amt">${yen(c.amount)}</span>${S.admin||mineFam(c.createdBy)?(S.confirm==='c:'+c._id?`<button class="btn sm danger" data-act="delCost" data-r="${c._id}">削除</button>`:`<button class="link muted" data-act="confirm" data-k="c:${c._id}">削除</button>`):''}</div></div>`).join('')}</div>`;
  return h;
}

  if(S.open['consent:'+p._id])h+=`<div class="warn"><label class="check"><input type="checkbox" id="consent-${p._id}" data-draft-check="consent"> 写っている生徒とその保護者の了承を得ています（写真はこのページを開ける全員に表示されます）</label><div class="actions" style="margin-top:6px"><button class="btn sm" data-act="close" data-k="consent:${p._id}">やめる</button><button class="btn sm primary" data-act="pickPhoto" data-p="${p._id}">写真を選ぶ</button></div></div>`;

}
function viewRecord(){
  const t=S.sub.record;

  let h=`<section class="card" style="padding-bottom:4px">${tabs('record',[['menu','練習メニュー'],['activity','活動記録'],['event','大会情報']],t)}</section>`;
  if(t==='menu'){
    h+=recs.length?recs.slice(0,10).map(recordCard).join(''):`<div class="empty"><strong>練習記録はまだありません</strong><span>練習が終わったら、メニュー・気づき・写真を残しておけます。</span></div>`;

  }else{
    const ev=recs.filter(p=>p.record.info);
    h+=ev.length?ev.map(p=>`<section class="card"><div class="row between"><strong>${mdw(p.date)}の記録より</strong><button class="link" data-act="sheet" data-k="record" data-p="${p._id}">編集</button></div><p class="body" style="white-space:pre-wrap;margin:0">${esc(p.record.info)}</p></section>`).join(''):`<div class="empty"><strong>大会情報はまだありません</strong><span>練習記録の「大会・お知らせ」欄に書いた内容がここに集まります。</span></div>`;
  }
  return h+`<button class="btn primary block" data-act="sheet" data-k="record">${ic('plus')}記録を作成</button>`;
}

/* ----- 月間参加記録 ----- */
function statsTable(withMoney){
  const ps=monthPractices().filter(p=>p.status!=='cancelled');
  if(!S.members.length)return `<div class="empty"><strong>選手がまだ登録されていません</strong><span>「マイページ」からお子さんを登録してください。</span></div>`;
  const {L}=withMoney?ledger(S.month):{L:{}};
  let h=`<div class="scroll"><table><thead><tr><th class="sticky">選手</th><th class="num">参加日数</th>${withMoney?'<th class="num">負担額</th><th class="num">差額</th>':''}${ps.map(p=>`<th class="c">${md(p.date)}<br><span style="font-weight:400">${wd(p.date)}</span></th>`).join('')}<th>参加した日</th></tr></thead><tbody>`;
  for(const m of S.members){
    const days=ps.filter(p=>resp(p._id,m._id)?.attend==='yes');const set=new Set(days.map(p=>p._id));
    const b=L[m._id];
    h+=`<tr${isMine(m._id)?' class="mine"':''}><td class="sticky"><strong>${esc(m.name)}</strong></td><td class="num">${days.length}日</td>${withMoney?`<td class="num">${yen(b.owe)}</td><td class="num ${b.bal<0?'minus':b.bal>0?'plus':''}">${b.bal>0?'+':b.bal<0?'−':''}${yen(Math.abs(b.bal))}</td>`:''}
      ${ps.map(p=>`<td class="c">${set.has(p._id)?'<span class="mk" title="参加"></span>':'<span class="mk off" title="参加なし"></span>'}</td>`).join('')}
      <td style="white-space:normal;min-width:150px" class="small muted">${days.length?days.map(p=>mdw(p.date)).join('、'):'—'}</td></tr>`;
  }
  return h+`</tbody></table></div><p class="note">「参加」で登録された練習（管理者が追加した分を含む）を参加日として数えています（中止を除く練習${ps.length}回）。● 参加 ／ ○ 参加なし</p>`;
}

    <p class="note">連絡先はこのページを開ける全員に表示されます。個人の電話番号は本人の了承を取ってから載せてください。</p>
    <div class="actions"><button class="btn sm primary">保存する</button></div></form>`;
  h+=`<form class="card" id="a-pw" data-form="password"><h2>ログイン用パスワード</h2>

    <div class="actions">${s.pwHash?(S.confirm==='pwclear'?`<button type="button" class="btn sm danger" data-act="pwClear">本当にパスワードをなくす</button>`:`<button type="button" class="link muted" data-act="confirm" data-k="pwclear">パスワードをなくす</button>`):''}<button class="btn sm primary">${s.pwHash?'変更する':'設定する'}</button></div></form>`;

      <div class="field"><label for="py-m">支払った人</label><select id="py-m" data-draft="py.m">${S.members.map(m=>`<option value="${m._id}"${draft('py.m',rep())===m._id?' selected':''}>${esc(famLabel(m._id))}（${esc(m.name)}）</option>`).join('')}</select></div>
