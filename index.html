      <div class="actions wide">${close}<button class="btn primary">記録する</button></div></form>`;
  }
  if(k==='cost'){
    return `<form data-form="cost" class="fgrid"><h2 class="wide">ボール代・備品代を追加</h2>
      <div class="field"><label for="c-kind">種類</label><select id="c-kind" data-draft="c.kind">${['ボール代','備品代','その他'].map(x=>`<option${draft('c.kind','ボール代')===x?' selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="c-date">日付</label><input id="c-date" type="date" data-draft="c.date" value="${esc(draft('c.date',today()))}"></div>
      <div class="field"><label for="c-amt">金額（円）</label><input id="c-amt" type="number" min="0" inputmode="numeric" data-draft="c.amount" value="${esc(draft('c.amount',''))}"></div>
      <div class="field"><label for="c-split">負担する人</label><select id="c-split" data-draft="c.split"><option value="all"${draft('c.split','all')==='all'?' selected':''}>登録している全員で割る</option><option value="practice"${draft('c.split','all')==='practice'?' selected':''}>選んだ練習の参加者で割る</option></select></div>
      <div class="field wide"><label for="c-p">対象の練習</label><select id="c-p" data-draft="c.practiceId"><option value="">指定なし</option>${monthPractices().map(p=>`<option value="${p._id}"${draft('c.practiceId','')===p._id?' selected':''}>${mdw(p.date)} ${esc(p.place)}</option>`).join('')}</select></div>
      <div class="field wide"><label for="c-note">メモ</label><input id="c-note" data-draft="c.note" value="${esc(draft('c.note',''))}" placeholder="例：新品購入・3か月分"></div>
      <div class="field wide"><label for="c-payer">立て替えた人</label><select id="c-payer" data-draft="c.payer"><option value="">まだ払っていない</option>${S.members.map(m=>`<option value="${m._id}"${draft('c.payer',rep()||'')===m._id?' selected':''}>${esc(famLabel(m._id))}（${esc(m.name)}）</option>`).join('')}</select></div>
      <div class="actions wide">${close}<button class="btn primary">追加する</button></div></form>`;
  }
  if(k==='post'){
    return `<form data-form="post" class="fgrid"><h2 class="wide">連絡を投稿</h2>
      <div class="field wide"><label for="po-title">件名</label><input id="po-title" data-draft="po.title" value="${esc(draft('po.title',''))}" placeholder="例：10/24 の練習について"></div>
      <div class="field wide"><label for="po-body">本文</label><textarea id="po-body" data-draft="po.body">${esc(draft('po.body',''))}</textarea></div>
      <div class="field"><label for="po-level">種類</label><select id="po-level" data-draft="po.level">${[['normal','通常'],['important','重要（確認してもらう）'],['emergency','緊急（雨天中止・急な変更）']].map(([v,l])=>`<option value="${v}"${draft('po.level','normal')===v?' selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="po-p">関係する練習</label><select id="po-p" data-draft="po.practiceId"><option value="">全体の連絡</option>${upcoming().map(p=>`<option value="${p._id}"${draft('po.practiceId',c.p||'')===p._id?' selected':''}>${mdw(p.date)} ${esc(p.place)}</option>`).join('')}</select></div>
      ${S.admin?`<label class="check wide"><input type="checkbox" id="po-pin" data-draft-check="po.pinned" ${draft('po.pinned',false)?'checked':''}> 上部に固定表示する（管理者）</label>`:''}
      <div class="actions wide">${close}<button class="btn primary">投稿する</button></div></form>`;
  }
  if(k==='record'){
    const cand=S.practices.filter(p=>p.date<=today()&&p.status!=='cancelled').sort((a,b)=>b.date.localeCompare(a.date));
    const pid=draft('rc.p',c.p||(cand.find(p=>!p.record)||cand[0])?._id||'');
    const pr=practice(pid);const r=pr?.record||{};const f=(x,def)=>esc(draft('rc.'+x,r[x]??def??''));
    if(!cand.length)return `<h2>記録を作成</h2><p class="note">終わった練習がまだありません。練習日を過ぎると記録を書けます。</p><div class="actions">${close}</div>`;
    return `<form data-form="record" class="fgrid"><h2 class="wide">${pr?.record?'練習記録を編集':'練習記録を作成'}</h2>
      <div class="field wide"><label for="rc-p">練習日</label><select id="rc-p" data-draft="rc.p">${cand.map(p=>`<option value="${p._id}"${p._id===pid?' selected':''}>${mdw(p.date)} ${esc(p.place)}${p.record?'（記録あり）':''}</option>`).join('')}</select></div>
      <div class="field wide"><label for="rc-menu">練習メニュー（1行に1つ）</label><textarea id="rc-menu" data-draft="rc.menu" placeholder="ウォーミングアップ（20分）&#10;ラリー練習（30分）&#10;サーブ練習（30分）&#10;試合形式（40分）">${f('menu')}</textarea></div>
      <div class="field wide"><label for="rc-memo">気づき・メモ</label><textarea id="rc-memo" data-draft="rc.memo" placeholder="例：サーブの確率が上がってきた。">${f('memo')}</textarea></div>
      <div class="field wide"><label for="rc-next">次回の課題</label><input id="rc-next" data-draft="rc.next" value="${f('next')}" placeholder="例：リターン練習を多めに"></div>
      <div class="field"><label for="rc-balls">使ったボール・備品</label><input id="rc-balls" data-draft="rc.balls" value="${f('balls')}" placeholder="例：練習球2缶"></div>
      <div class="field"><label for="rc-info">大会・お知らせ</label><input id="rc-info" data-draft="rc.info" value="${f('info')}" placeholder="例：11/15 市民大会 申込締切 11/1"></div>
      <p class="note wide">写真は保存したあと、記録カードの「＋」から追加できます。生徒の成績は載せないでください。</p>
      <div class="actions wide">${close}<button class="btn primary">保存する</button></div></form>`;
  }
  return '';
}

/* ---------- actions ---------- */
async function setResp(pid,mid,patch){
  const cur=resp(pid,mid);
  const next={practiceId:pid,memberId:mid,attend:cur?.attend||null,transport:cur?.transport||null,seats:cur?.seats??0,route:cur?.route||'',pickup:cur?.pickup||'',...patch,updatedAt:Date.now()};
  return write(()=>col('responses').doc(pid+'__'+mid).set(next));
}
function clearDrafts(prefix){for(const k of Object.keys(S.drafts))if(k.startsWith(prefix))delete S.drafts[k]}
function go(tab){S.tab=tab;S.detail=null;S.drawer=false;S.bell=false;S.confirm=null;try{localStorage.setItem('tennis.tab',tab)}catch(_){}window.scrollTo({top:0})}
function openSheet(k,ctx){S.sheet=k;S.ctx=ctx||{};S.drawer=false;S.bell=false}
function closeSheet(){S.sheet=null;S.ctx={};['pf.','rg.','as.','py.','c.','po.','rc.'].forEach(clearDrafts)}
async function markRead(){
  const r=rep();if(!r||!S.db)return;
  const todo=S.posts.filter(p=>!readDoc(p._id)).slice(0,30);
  for(const p of todo){try{await col('reads').doc(p._id+'__'+r).set({postId:p._id,memberId:r,at:Date.now(),confirmed:false})}catch(_){break}}
}
const FIELDS={date:'日付',start:'開始',end:'終了',place:'コート',court:'コート番号',fee:'テニスコート代金',meetTime:'集合時間',meetPlace:'集合場所',bring:'持ち物',deadline:'回答締切',note:'メモ'};

document.addEventListener('click',async e=>{
  if(e.target.closest('[data-stop]')&&!e.target.closest('[data-act]'))return;
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const a=b.dataset.act,k=b.dataset.k,p=b.dataset.p,r=b.dataset.r,m=b.dataset.m;
  if(a==='closeOverlay'&&b!==e.target)return;
  if(a!=='confirm'&&!a.startsWith('del')&&a!=='payAll')S.confirm=null;
  switch(a){
    case 'tab':go(k);if(k==='talk')markRead();break;
    case 'drawer':S.drawer=true;S.bell=false;break;
    case 'bell':S.bell=!S.bell;S.drawer=false;break;
    case 'closeOverlay':S.drawer=false;S.bell=false;if(S.sheet)closeSheet();break;
    case 'closeSheet':closeSheet();break;
    case 'back':S.detail=null;window.scrollTo({top:0});break;
    case 'sub':if(b.dataset.g==='dtab')S.dtab=k;else S.sub[b.dataset.g]=k;break;
    case 'openDetail':S.detail=p;S.dtab=k||'summary';S.attFilter='yes';S.drawer=false;S.bell=false;window.scrollTo({top:0});break;
    case 'attFilter':S.attFilter=k;break;
    case 'planMode':S.planMode=S.planMode==='stats'?'list':'stats';break;
    case 'goRide':{const pid=p||upcoming().find(x=>x.status!=='cancelled')?._id;if(!pid){go('plan');break}
      S.drawer=false;S.bell=false;S.detail=pid;S.dtab='ride';S.sub.ride=k||(S.rides.some(x=>x.practiceId===pid&&x.status==='open'&&x.toId&&isMine(x.toId))?'result':S.sub.ride);window.scrollTo({top:0});break}
    case 'ridePick':S.ridePid=p;break;
    case 'goMoney':go('money');S.sub.money='month';if(k)S.month=k;break;
    case 'goMoneySum':go('money');S.sub.money='summary';break;
    case 'goTalk':go('talk');S.sub.talk=k||'all';markRead();break;
    case 'recTab':go('record');S.sub.record='menu';break;
    case 'jump':document.getElementById(k)?.scrollIntoView({behavior:'smooth',block:'start'});return;
    case 'month':S.month=(()=>{const [y,mm]=S.month.split('-').map(Number);return ym(new Date(y,mm-1+Number(k),1))})();break;
    case 'open':S.open[k]=true;break;
    case 'toggle':S.open[k]=!S.open[k];break;
    case 'close':S.open[k]=false;break;
    case 'confirm':S.confirm=k||null;break;
    case 'sheet':openSheet(k,{p,m});break;
    case 'newPractice':openSheet('new',{});break;
    case 'delPractice':S.confirm=null;
      if(await write(()=>col('practices').doc(p).delete(),'練習予定を削除しました')){
        S.detail=null;
        for(const x of S.responses.filter(x=>x.practiceId===p))await write(()=>col('responses').doc(x._id).delete());
        for(const x of S.rides.filter(x=>x.practiceId===p))await write(()=>col('rides').doc(x._id).delete());
      }break;
    case 'uncancel':{const pr=practice(p);await write(()=>col('practices').doc(p).update({status:'scheduled',cancelReason:'',history:[...(pr.history||[]),{at:Date.now(),text:'中止を取り消し、予定どおり実施'}]}),'中止を取り消しました');break}
    case 'attend':await setResp(p,m,k?{attend:'yes',walkIn:false}:{attend:null,transport:null});break;
    case 'adminAttend':if(!S.admin)break;await setResp(p,m,k?{attend:'yes',walkIn:true,addedAt:Date.now()}:{attend:null,transport:null,walkIn:false});break;
    case 'unregister':if(await setResp(p,m,{transport:null}))closeSheet();break;
    case 'take':{
      const C=rideCtx(practice(p));const myD=C.drivers.find(d=>isMine(d.memberId));if(!myD)break;
      const req=C.rides.find(x=>x.fromId===m&&x.status!=='accepted');const pick=resp(p,m)?.pickup||'';
      if(req)await write(()=>col('rides').doc(req._id).update({status:'accepted',byId:myD.memberId,meetPoint:pick,updatedAt:Date.now()}),'送迎が決まりました');
      else await write(()=>col('rides').add({practiceId:p,fromId:m,toId:myD.memberId,message:'',status:'accepted',byId:myD.memberId,meetPoint:pick,createdAt:Date.now()}),'送迎が決まりました');
      break}
    case 'rideAccept':{const x=S.rides.find(y=>y._id===r);const myD=S.responses.find(y=>y.practiceId===x.practiceId&&isMine(y.memberId)&&y.transport==='can');await write(()=>col('rides').doc(r).update({status:'accepted',byId:myD?.memberId||rep(),meetPoint:resp(x.practiceId,x.fromId)?.pickup||'',updatedAt:Date.now()}),'送迎を引き受けました');break}
    case 'rideDecline':await write(()=>col('rides').doc(r).update({status:'declined',updatedAt:Date.now()}));break;
    case 'rideUndo':await write(()=>col('rides').doc(r).delete(),'送迎の決定を取り消しました');break;
    case 'rideDel':await write(()=>col('rides').doc(r).delete(),'依頼を取り消しました');break;
    case 'pwClear':{S.confirm=null;if(!S.admin)break;const rest={...S.settings};delete rest.pwHash;delete rest.pwSalt;delete rest.pwSetAt;await write(()=>S.db.doc('settings/app').set(rest),'パスワードをなくしました');break}
    case 'logout':S.unlocked='';try{localStorage.removeItem('tennis.unlock')}catch(_){}S.drawer=false;break;
    case 'settle':{
      S.confirm=null;
      const o=transfers(S.month)[Number(k)];if(!o)break;
      await write(()=>col('payments').add({memberId:o.from,to:o.to,practiceId:'',costId:'',settle:true,month:S.month,date:today(),amount:o.amount,note:mnum(S.month)+'分の精算',createdAt:Date.now()}),'精算を記録しました');
      break}
    case 'delPay':S.confirm=null;await write(()=>col('payments').doc(r).delete(),'支払い記録を削除しました');break;
    case 'delCost':S.confirm=null;await write(()=>col('costs').doc(r).delete(),'費用を削除しました');break;
    case 'confirmRead':if(rep())await write(()=>col('reads').doc(r+'__'+rep()).set({postId:r,memberId:rep(),at:Date.now(),confirmed:true}),'確認済みにしました');break;
    case 'like':{if(!rep())break;const id=r+'__'+rep();const had=S.likes.some(x=>x._id===id);await write(()=>had?col('likes').doc(id).delete():col('likes').doc(id).set({postId:r,memberId:rep(),at:Date.now()}));break}
    case 'pin':{const po=S.posts.find(x=>x._id===r);await write(()=>col('posts').doc(r).update({pinned:!po.pinned}));break}
    case 'delPost':S.confirm=null;await write(()=>col('posts').doc(r).delete(),'連絡を削除しました');break;
    case 'delComment':await write(()=>col('comments').doc(r).delete());break;
    case 'delMember':S.confirm=null;await write(()=>col('members').doc(r).delete(),'選手を削除しました');if(isMine(r))await setFamily(S.family.filter(x=>x!==r));break;
    case 'saveMember':{
      const mm=mem(r);const n=String(draft('em.'+r+'.n',mm.name)).trim();
      if(!n){toast('選手名を入力してください');return}
      if(await write(()=>col('members').doc(r).update({name:n,parent:String(draft('em.'+r+'.p',mm.parent||'')).trim()}),'保存しました')){S.open['mem:'+r]=false;clearDrafts('em.'+r)}
      break}
    case 'addPhoto':S.open['consent:'+p]=true;S.drafts.consent=false;break;
    case 'pickPhoto':if(!S.drafts.consent){toast('了承を得ていることにチェックしてください');return}S.photoFor=p;document.getElementById('photo-input').click();return;
    case 'delPhoto':{
      const pr=practice(p);const ph=recPhotos(pr.record).filter(x=>x.id!==r);
      try{await S.assets.delete(r)}catch(err){if(err&&err.code==='not_uploader'){toast('ほかの人が追加した写真は削除できません');return}}
      await write(()=>col('practices').doc(p).update({record:{...pr.record,photos:ph}}),'写真を削除しました');break}
  }
  render();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.draftCheck){S.drafts[t.dataset.draftCheck]=t.checked;return}
  if(t.dataset.draft){S.drafts[t.dataset.draft]=t.value;if(t.dataset.draft==='rg.m'||t.dataset.draft==='rc.p'){if(t.dataset.draft==='rc.p')['rc.menu','rc.memo','rc.next','rc.balls','rc.info'].forEach(x=>delete S.drafts[x]);else{S.ctx.m=t.value;['rg.seats','rg.route','rg.pickup'].forEach(x=>delete S.drafts[x])}renderOverlay(todoItems())}return}
  if(t.dataset.actChange==='fam'){const id=t.value;await setFamily(t.checked?[...S.family.filter(x=>x!==id),id]:S.family.filter(x=>x!==id));render();return}
  if(t.dataset.actChange==='bring'){const key='tennis.bring.'+t.dataset.p;let c={};try{c=JSON.parse(localStorage.getItem(key)||'{}')}catch(_){}c[t.value]=t.checked;try{localStorage.setItem(key,JSON.stringify(c))}catch(_){}render();return}
  if(t.id==='photo-input'&&t.files&&t.files[0]){const f=t.files[0];t.value='';await uploadPhoto(S.photoFor,f);render()}
});
document.addEventListener('input',e=>{const k=e.target.dataset.draft;if(k)S.drafts[k]=e.target.value});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target,kind=f.dataset.form,c=S.ctx;
  const T=k=>String(draft(k,'')??'').trim();
  if(kind==='member'){
    const n=T('nm.name');if(!n){toast('選手名を入力してください');return}
    if(!S.db){toast('共有データに接続できないため保存できません。');return}
    const ref=col('members').doc();
    if(await write(()=>ref.set({name:n,parent:T('nm.parent'),createdAt:Date.now()}),n+'さんを登録しました')){clearDrafts('nm.');await setFamily([...S.family,ref.id])}
  }
  if(kind==='practice'){
    const base=c.base||{};const g=x=>String(draft('pf.'+x,base[x]??'')??'').trim();
    const data={date:g('date'),start:g('start'),end:g('end'),place:g('place'),court:g('court').replace(/番(コート)?$/,''),fee:g('fee')?Number(g('fee')):0,meetTime:g('meetTime'),meetPlace:g('meetPlace'),deadline:g('deadline'),bring:g('bring'),note:g('note')};
    if(!data.date||!data.place||!data.court){toast('日付・テニスコート名・コート番号を入力してください');return}
    if(S.sheet==='practice'){
      const P=practice(c.p);
      const changes=Object.keys(FIELDS).filter(x=>String(P[x]??'')!==String(data[x]??'')).map(x=>`${FIELDS[x]}：${P[x]||'なし'} → ${data[x]||'なし'}`);
      const hist=[...(P.history||[])];if(changes.length)hist.push({at:Date.now(),text:changes.join('、')});
      if(await write(()=>col('practices').doc(c.p).update({...data,history:hist}),'練習予定を更新しました'))closeSheet();
    }else{
      Object.assign(data,{status:'scheduled',history:[],createdBy:rep()||'',createdAt:Date.now()});
      if(await write(()=>col('practices').add(data),'練習予定を作成しました')){closeSheet();S.month=data.date.slice(0,7)}
    }
  }
  if(kind==='cancel'){
    const p=f.dataset.p,pr=practice(p),reason=T('cr.'+p)||'中止します';
    if(await write(()=>col('practices').doc(p).update({status:'cancelled',cancelReason:reason,history:[...(pr.history||[]),{at:Date.now(),text:'中止：'+reason}]}),'中止にしました')){
      if(draft('cn.'+p,true))await write(()=>col('posts').add({title:`${mdw(pr.date)} ${pr.place} の練習は中止です`,body:reason,level:'emergency',pinned:false,practiceId:p,authorId:rep()||'',createdAt:Date.now()}));
      S.open['cancel:'+p]=false;clearDrafts('cr.'+p);
    }
  }
  if(kind==='driver'||kind==='rider'){
    const m=draft('rg.m',c.m||S.family[0]);const r=resp(c.p,m)||{};
    const patch=kind==='driver'?{attend:'yes',transport:'can',seats:Number(draft('rg.seats',r.seats||3)),route:T('rg.route')||r.route||''}:{attend:'yes',transport:'cannot',pickup:T('rg.pickup')||r.pickup||''};
    if(await setResp(c.p,m,patch)){toast('登録しました');closeSheet()}
  }
  if(kind==='walkin'){
    const ids=S.members.filter(m=>draft('wi.'+m._id,false)).map(m=>m._id);
    const nn=T('wi.new');
    if(!ids.length&&!nn){toast('追加する子を選ぶか、名前を入力してください');return}
    if(nn){const ref=col('members').doc();if(await write(()=>ref.set({name:nn,parent:'',createdAt:Date.now()})))ids.push(ref.id)}
    let ok=true;for(const id of ids)ok=(await setResp(c.p,id,{attend:'yes',walkIn:true,addedAt:Date.now()}))&&ok;
    if(ok){toast(ids.length+'人を参加者に追加しました');clearDrafts('wi.');closeSheet()}
  }
  if(kind==='ask'){
    if(await write(()=>col('rides').add({practiceId:c.p,fromId:c.m,toId:T('as.to'),message:T('as.msg'),status:'open',byId:null,meetPoint:'',createdAt:Date.now()}),'送迎のお願いを送りました'))closeSheet();
  }
  if(kind==='pay'){
    const pr=c.p?practice(c.p):null,cst=c.m?S.costs.find(x=>x._id===c.m):null;
    const amt=Number(draft('py.a',cst?cst.amount:pr?pr.fee:'')||0),mid=draft('py.m',rep()),to=pr||cst?'':T('py.t');
    const d=draft('py.d',cst?cst.date:pr?(pr.date<=today()?pr.date:today()):today());
    if(!mid||!amt){toast('支払った人と金額を入力してください');return}
    if(to&&to===mid){toast('支払った人と支払い先が同じです');return}
    const pid=cst?'':pr?pr._id:draft('py.p','');
    // which month this payment belongs to: the court day / cost date, otherwise the payment date
    const month=(cst?cst.date:pid?practice(pid)?.date:d||'').slice(0,7)||d.slice(0,7);
    if(await write(()=>col('payments').add({memberId:mid,to,practiceId:pid,costId:cst?cst._id:'',settle:!!to,month,date:d,amount:amt,note:T('py.n'),createdAt:Date.now()}),'支払いを記録しました'))closeSheet();
  }
  if(kind==='cost'){
    const amt=Number(draft('c.amount',0)),split=draft('c.split','all'),pid=draft('c.practiceId',''),payer=draft('c.payer',rep()||''),date=draft('c.date',today());
    if(!amt){toast('金額を入力してください');return}
    if(split==='practice'&&!pid){toast('参加者で割る場合は対象の練習を選んでください');return}
    const ref=col('costs').doc();
    if(await write(()=>ref.set({kind:draft('c.kind','ボール代'),date,amount:amt,split,practiceId:pid,note:T('c.note'),createdBy:rep()||'',createdAt:Date.now()}),'費用を追加しました')){
      if(payer)await write(()=>col('payments').add({memberId:payer,to:'',practiceId:'',costId:ref.id,settle:false,month:date.slice(0,7),date,amount:amt,note:'立替',createdAt:Date.now()}));
      closeSheet();
    }
  }
  if(kind==='post'){
    const title=T('po.title');if(!title){toast('件名を入力してください');return}
    if(await write(()=>col('posts').add({title,body:T('po.body'),level:draft('po.level','normal'),pinned:!!(S.admin&&draft('po.pinned',false)),practiceId:draft('po.practiceId',c.p||''),authorId:rep()||'',createdAt:Date.now()}),'投稿しました'))closeSheet();
  }
  if(kind==='comment'){
    const r=f.dataset.r,body=T('cm.'+r);if(!body)return;
    if(await write(()=>col('comments').add({postId:r,body,authorId:rep()||'',createdAt:Date.now()})))clearDrafts('cm.'+r);
  }
  if(kind==='record'){
    const cand=S.practices.filter(p=>p.date<=today()&&p.status!=='cancelled').sort((a,b)=>b.date.localeCompare(a.date));
    const pid=draft('rc.p',c.p||(cand.find(p=>!p.record)||cand[0])?._id);const pr=practice(pid);if(!pr)return;const r=pr.record||{};
    const g=x=>String(draft('rc.'+x,r[x]??'')).trim();
    const rec={menu:g('menu'),memo:g('memo'),next:g('next'),balls:g('balls'),info:g('info'),photos:recPhotos(r),by:r.by||rep()||'',at:Date.now()};
    if(await write(()=>col('practices').doc(pid).update({record:rec}),'練習記録を保存しました')){closeSheet();if(S.tab==='record')S.sub.record='menu'}
  }
  if(kind==='settings'){
    const s=S.settings;
    const data={round:Number(draft('st.round',s.round||10)),leader:String(draft('st.leader',s.leader||'')).trim(),contact:String(draft('st.contact',s.contact||'')).trim(),procedure:String(draft('st.procedure',s.procedure||'')).trim()};
    if(await write(()=>S.db.doc('settings/app').set({...S.settings,...data}),'保存しました'))clearDrafts('st.');
  }
  if(kind==='password'){
    if(!S.admin)return;
    const p1=String(draft('pw.1','')),p2=String(draft('pw.2',''));
    if(p1.length<4){toast('パスワードは4文字以上にしてください');return}
    if(p1!==p2){toast('2回入力したパスワードが違います');return}
    const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
    const pwHash=await sha(salt+':'+p1);
    if(await write(()=>S.db.doc('settings/app').set({...S.settings,pwSalt:salt,pwHash,pwSetAt:Date.now()}),'パスワードを設定しました'))clearDrafts('pw.');
  }
  if(kind==='unlock'){
    const h=await sha((S.settings.pwSalt||'')+':'+String(draft('lk.pw','')));
    if(h===S.settings.pwHash){S.unlocked=h;S.lockErr='';clearDrafts('lk.');try{localStorage.setItem('tennis.unlock',h)}catch(_){}}
    else S.lockErr='パスワードが違います。';
  }
  S.pendingRender=false;render();
});

async function uploadPhoto(pid,file){
  if(!S.assets||!pid)return;
  try{
    const blob=await shrink(file);
    const res=await S.assets.upload(blob,{type:'image/jpeg'});
    const pr=practice(pid);const r=pr.record||{};
    await write(()=>col('practices').doc(pid).update({record:{...r,photos:[...recPhotos(r),{id:res.id,by:rep()||''}]}}),'写真を追加しました');
    S.open['consent:'+pid]=false;
  }catch(err){
    const c=err&&err.code;
    toast(c==='too_large'?'写真が大きすぎます。':c==='unsupported_type'?'この形式の画像は追加できません。':c==='quota_or_state'?'写真の保存容量がいっぱいです。':c==='rate_limited'?'少し時間をおいてからもう一度お試しください。':'写真を追加できませんでした。');
  }
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      cv.toBlob(b=>b?res(b):rej({code:'invalid_request'}),'image/jpeg',0.85)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej({code:'unsupported_type'})};
    img.src=url;
  });
}
async function setFamily(ids){
  S.family=ids.filter((x,i)=>ids.indexOf(x)===i);
  try{localStorage.setItem('tennis.family',JSON.stringify(S.family))}catch(_){}
  if(S.db&&S.uid){try{await S.db.doc('data/users/'+S.uid+'/profile').set({memberIds:S.family})}catch(_){}}
  const head=S.family[0];
  if(head&&S.db)for(const id of S.family){const m=mem(id);if(m&&m.family!==head){try{await col('members').doc(id).update({family:head})}catch(_){}}}
}

/* ---------- boot ---------- */
try{const t=localStorage.getItem('tennis.tab');if(t&&TITLES[t])S.tab=t;const f=JSON.parse(localStorage.getItem('tennis.family')||'[]');if(Array.isArray(f))S.family=f}catch(_){}
render();
(async()=>{
  const claude=window.claude;
  const [db,user,assets]=claude?await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')]):[null,null,null];
  S.db=db;S.user=user;S.assets=assets;
  if(user){S.admin=await user.canEdit();S.uid=await user.id()}
  if(S.tab==='admin'&&!S.admin)S.tab='home';
  if(!db){S.ready=true;S.offline=true;render();return}
  if(S.uid){try{const s=await db.doc('data/users/'+S.uid+'/profile').get();if(s.exists&&Array.isArray(s.data().memberIds))S.family=s.data().memberIds.slice()}catch(_){}}
  const map=snap=>snap.docs.map(d=>({...d.data(),_id:d.id}));
  const keys=['members','practices','responses','rides','payments','costs','posts','comments','reads','likes'];
  const seen=new Set();let first=true;
  const done=()=>{if(seen.size>=keys.length+1){if(first){first=false;S.family=S.family.filter(id=>mem(id))}S.ready=true;scheduleRender()}};
  const onErr=err=>{if(err.code!=='revoked')toast('データの受信が止まりました。ページを開き直してください。')};
  for(const k of keys)col(k).onSnapshot(snap=>{S[k]=map(snap);if(k==='members')S.members.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));seen.add(k);done()},onErr);
  db.doc('settings/app').onSnapshot(s=>{S.settings=s.exists?s.data():{};seen.add('settings');done()},onErr);
})();
})();
</script>
